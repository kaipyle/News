# Temporário: grava uma coleta real em test/fixtures para desenvolver a interface offline.
name: Snapshot (temporário)
on:
  push:
    branches: [claude/news-aggregator-bias-labels-wwb99m]
    paths: ['.github/workflows/snapshot.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/build-feed.mjs
      - run: |
          mkdir -p test/fixtures && cp public/data/feed.json test/fixtures/feed.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/fixtures/feed.json
          git commit -m "Snapshot de coleta real para desenvolvimento offline" && git push
