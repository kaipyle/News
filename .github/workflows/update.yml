name: Atualizar notícias
# Coleta os feeds e publica o app no GitHub Pages.
# Requer: Settings → Pages → Source: "GitHub Actions".
#
# O agendamento do GitHub atrasa e às vezes nem dispara. Por isso o ritmo de
# 15 min vem do job "proxima": ele espera o fim do intervalo e dispara a rodada
# seguinte. O "schedule" fica só como rede de segurança, para religar a corrente.
# Para parar: desative o workflow na aba Actions, ou crie a variável
# ATUALIZACAO_CONTINUA com o valor "off" em Settings → Secrets and variables → Actions.

on:
  schedule:
    - cron: '41 * * * *' # religa a corrente se ela parar
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # disparar a próxima rodada e manter o workflow ligado

# Uma rodada por vez; se chegar mais de uma pedida, só a mais recente espera na fila.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Coletar notícias
        run: node scripts/build-feed.mjs
        env:
          # reaproveita autores, imagens e matérias que já saíram do RSS
          PREVIOUS_FEED_URL: ${{ steps.pages.outputs.base_url }}/data/feed.json
      - name: Carimbar a versão do app
        run: node scripts/stamp-version.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Manter o workflow ativo
        # Em repositório público, o GitHub desliga workflows agendados após 60 dias sem commits.
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          if [ "$(date -u +%H%M)" \< "0030" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  proxima:
    # Roda também quando a coleta falha, para a corrente não parar; não roda se a rodada for cancelada.
    needs: publicar
    if: ${{ !cancelled() && github.event_name != 'push' && vars.ATUALIZACAO_CONTINUA != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Esperar o intervalo e disparar a próxima coleta
        run: |
          inicio=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          espera=$(( 900 - 20 - ($(date +%s) - $(date -d "$inicio" +%s)) ))
          if [ "$espera" -gt 0 ]; then sleep "$espera"; fi
          gh workflow run update.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
