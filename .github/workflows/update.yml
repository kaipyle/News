name: Atualizar notícias
# Coleta os feeds e publica o app no GitHub Pages.
# Requer: Settings → Pages → Source: "GitHub Actions".
#
# Roda pelo agendamento do GitHub, a cada 30 min. Cada rodada leva uns 2 minutos de máquina
# e termina; nada fica esperando. O GitHub pode atrasar ou pular horários do agendamento.
# Repositório público: os minutos de Actions são gratuitos.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # só o passo que mantém o workflow ligado

# Uma rodada por vez; se chegar mais de uma pedida, só a mais recente espera na fila.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Coletar notícias
        run: node scripts/build-feed.mjs
        env:
          # reaproveita autores, imagens e matérias que já saíram do RSS
          PREVIOUS_FEED_URL: ${{ steps.pages.outputs.base_url }}/data/feed.json
      - name: Carimbar a versão do app
        run: node scripts/stamp-version.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Manter o workflow ativo
        # Em repositório público, o GitHub desliga workflows agendados após 60 dias sem commits.
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          if [ "$(date -u +%H%M)" \< "0030" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
