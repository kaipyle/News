<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mirante</title>
  <meta name="description" content="Notícias de fontes confiáveis num só lugar, com a linha editorial de cada veículo à vista.">
  <meta name="theme-color" content="#f6f7f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mirante">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/piazzolla-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/schibsted-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="data/feed.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip" href="#main">Pular para as notícias</a>

  <header class="top" id="top">
    <div class="top-row">
      <a class="brand" href="#/" aria-label="Mirante, início">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18M5 18v-3M8 18v-2M11 18v-3M13 18V9M16 18v-2M19 18v-3" /></svg>
        <span class="brand-name">Mirante</span>
      </a>
      <nav class="tabs tabs-top" aria-label="Seções"></nav>
      <div class="top-actions">
        <button class="icon-btn" data-action="search" aria-label="Buscar" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
        </button>
        <button class="icon-btn" data-action="filters" aria-label="Filtros">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
          <span class="badge" hidden></span>
        </button>
        <button class="icon-btn" data-action="translate" aria-pressed="false" aria-label="Traduzir matérias em inglês para o português">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5.5h9M8 3.5v2M10.5 5.5c-.6 3.6-3 6.4-6.5 8M5.5 8.5c1.2 2.4 3.2 4.2 5.5 5"/><path d="m12.5 20.5 4-9 4 9M13.8 17.6h5.4"/></svg>
        </button>
        <button class="icon-btn" data-action="help" aria-label="Como funciona">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.4"/><circle cx="12" cy="16.9" r=".6" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
    <div class="search-row" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      <input type="search" id="q" placeholder="Buscar por assunto, jornal ou autor" autocomplete="off" enterkeyhint="search">
      <button class="text-btn" data-action="search-close">Fechar</button>
    </div>
    <div class="chips-row" role="toolbar" aria-label="Temas"></div>
  </header>

  <button class="fresh" data-action="apply-fresh" hidden></button>
  <div class="toast" role="status" aria-live="polite" hidden></div>

  <main id="main" tabindex="-1">
    <div class="loading" aria-live="polite">
      <div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>
    </div>
  </main>

  <nav class="tabs tabs-bottom" aria-label="Seções"></nav>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-scrim" data-action="close-sheet"></div>
    <div class="sheet-panel">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button class="icon-btn" data-action="close-sheet" aria-label="Fechar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="sheet-body"></div>
      <div class="sheet-foot" hidden></div>
    </div>
  </div>

  <noscript><p class="noscript">O Mirante precisa de JavaScript para carregar as notícias.</p></noscript>
  <script src="app.js" type="module"></script>
</body>
</html>
